# Render Blueprint: the FastAPI backend (review queue API + live assistant for PRISM).
# In Render: New > Blueprint > pick this repo. Render asks for every `sync: false` value once;
# those secrets live only in Render, never in the repo.
services:
  - type: web
    name: penncoin-backend
    runtime: python
    plan: free                      # spins down after 15 min idle; first request takes ~1 min
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Live assistant: guardrails + rules engine decide, Nicrron writes the answer.
      - key: ASSISTANT_MODE
        value: nicrron
      - key: ASSISTANT_CALLS_PER_MINUTE
        value: "30"
      - key: NICRRON_MODEL
        value: anthropic/claude-sonnet-5-5
      - key: NICRRON_MODELS
        value: anthropic/claude-sonnet-5-5
      - key: DRAFTER
        value: template
      - key: MODEL_CALLS_PER_MINUTE
        value: "10"
      - key: ALLOWED_ORIGINS
        value: https://ns-programmer.github.io
      - key: PRISMTRACE_HOST
        value: https://api.prism.blockconvey.com
      # Secrets: entered in Render on first deploy.
      - key: NICRRON_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: ASSISTANT_API_KEY      # optional; leave blank for an open endpoint
        sync: false
      - key: PRISMTRACE_API_KEY     # optional; turns on PRISM tracing
        sync: false
      - key: PRISMTRACE_PROJECT_ID
        sync: false
